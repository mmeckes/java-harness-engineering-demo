# Review every PR with the same team harness developers use, through Amazon Bedrock.
# Off until you set the repository variable CLAUDE_REVIEW_ENABLED=true and the secret
# AWS_ROLE_TO_ASSUME (an IAM role trusted by GitHub's OIDC provider, scoped to this repo,
# with the Bedrock invoke policy). No long-lived AWS keys are stored.
name: claude-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
jobs:
  review:
    if: vars.CLAUDE_REVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/mmeckes/java-harness-engineering-demo.git
          plugins: |
            code-review@claude-plugins-official
            java-harness@mmeckes-harness-demo
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--max-turns 15 --model ${{ vars.BEDROCK_MODEL || ''eu.anthropic.claude-sonnet-4-5-20250929-v1:0'' }} --allowedTools "mcp__github_inline_comment__create_inline_comment"'
