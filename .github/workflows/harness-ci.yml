# Treat the harness like production code: every change to it is validated and tested.
# Needs no secrets and makes no model calls.
name: harness-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Validate marketplace and plugin
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugins/java-harness --strict
      - name: Offline hook tests
        run: ./scripts/test-hooks.sh
      - name: Build and test
        run: ./mvnw -q -B verify
